name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: go test -run=^$ -fuzz=Fuzz -fuzztime=30s ./internal/manifest
      - name: Install analyzers
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          golangci-lint config verify
          golangci-lint run ./...
      - name: Vulnerability check
        run: govulncheck ./...
      - name: Generate CycloneDX module SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -licenses -test -type library \
            -output "$RUNNER_TEMP/sandboxes-runtime.cdx.json" .
      - uses: actions/upload-artifact@v4
        with:
          name: sandboxes-runtime-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sandboxes-runtime.cdx.json
          if-no-files-found: error
          retention-days: 90
